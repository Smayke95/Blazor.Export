name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Blazor.Export.slnx

      - name: Build
        run: dotnet build Blazor.Export.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project S95.Blazor.Export.Tests --configuration Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack S95.Blazor.Export --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nuget-packages
          path: artifacts/*
